  <script>
    window.$docsify = {
      name: '📚 错题知识库',
      nameLink: '/',
      loadSidebar: true,
      subMaxLevel: 1,
      auto2top: false,
      search: {
        placeholder: '搜索错题...',
        noData: '没有找到相关错题',
        paths: 'auto',
        depth: 4,
      },
      plugins: [
        function(hook, vm) {
          hook.afterEach(function(html, next) {
            // 给表格包裹响应式容器
            html = html.replace(/<table>/g, '<div class="table-wrapper"><table>');
            html = html.replace(/<\/table>/g, '</table></div>');
            next(html);
          });
          // 侧边栏：默认折叠各科"错题记录"下的子题列表
          var folderTextCache = {}; // 缓存文本内容，防止路由切换后丢失
          function collapseSidebarFolders() {
            var sidebar = document.querySelector('.sidebar-nav');
            if (!sidebar) return;
            var allLis = sidebar.querySelectorAll('li');
            allLis.forEach(function(li) {
              var childUl = li.querySelector('ul');
              if (!childUl) return;
              // 收集 <li> 的直接文本节点（docsify 把纯文本条目渲染为直接文本节点，非 <p> 标签）
              var textContent = '';
              var textNodes = [];
              var hasStructuredContent = false;
              for (var i = 0; i < li.childNodes.length; i++) {
                var node = li.childNodes[i];
                if (node.nodeType === 3) { // Text node
                  var t = node.textContent.trim();
                  if (t) { textContent += t; textNodes.push(node); }
                } else if (node.nodeType === 1) { // Element node
                  if (node.tagName === 'UL') break; // 到达子 <ul>，停止
                  if (node.hasAttribute('data-folder')) {
                    // 已经处理过（doneEach 重新执行时）
                    hasStructuredContent = true;
                    break;
                  }
                  hasStructuredContent = true;
                  break;
                }
              }
              if (!textContent || hasStructuredContent) return;

              // 使用缓存，避免重建时丢失
              var cached = folderTextCache[textContent.trim()];
              var shouldBeExpanded = cached && cached.expanded;

              // 初始折叠
              childUl.style.display = shouldBeExpanded ? '' : 'none';

              // 将文本节点替换为可点击的 span
              var span = document.createElement('span');
              span.textContent = (shouldBeExpanded ? '▾ ' : '▸ ') + textContent;
              span.style.cursor = 'pointer';
              span.style.userSelect = 'none';
              span.setAttribute('data-folder', shouldBeExpanded ? 'expanded' : 'collapsed');
              textNodes.forEach(function(n) { li.removeChild(n); });
              li.insertBefore(span, childUl);

              span.addEventListener('click', function(e) {
                e.stopPropagation();
                e.preventDefault();
                if (childUl.style.display === 'none') {
                  childUl.style.display = '';
                  span.textContent = '▾ ' + textContent;
                  span.setAttribute('data-folder', 'expanded');
                  folderTextCache[textContent.trim()] = { expanded: true };
                } else {
                  childUl.style.display = 'none';
                  span.textContent = '▸ ' + textContent;
                  span.setAttribute('data-folder', 'collapsed');
                  folderTextCache[textContent.trim()] = { expanded: false };
                }
              });
            });
          }
          // doneEach: 每次路由切换后重新应用折叠
          hook.doneEach(function() {
            // 先让 MathJax 排版
            if (window.MathJax) {
              MathJax.typesetPromise();
            }
            // 延迟折叠，等 docsify 完成侧边栏 DOM 重建
            setTimeout(collapseSidebarFolders, 100);
          });
          // 初始加载时也执行
          hook.ready(function() {
            // 等初始 DOM 渲染完成后折叠
            var retryCount = 0;
            var initTimer = setInterval(function() {
              var sidebar = document.querySelector('.sidebar-nav');
              if (sidebar && sidebar.querySelectorAll('li').length > 0) {
                collapseSidebarFolders();
                clearInterval(initTimer);
              } else if (++retryCount > 30) {
                clearInterval(initTimer);
              }
            }, 200);
          });
        }
      ]
    };
  </script>

<!-- 选题组卷插件 -->
<script>
(function() {
  'use strict';

  const STORAGE_KEY = 'exam-builder-v2';
  const state = {
    selectedIds: new Set(),
    options: { includeAnalysis: true, includeSource: true, includeAnswer: false, includeSimilar: false }
  };

  function loadState() {
    try {
      const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (s) {
        state.selectedIds = new Set(s.selectedIds || []);
        if (s.options) Object.assign(state.options, s.options);
      }
    } catch(e) {}
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      selectedIds: [...state.selectedIds],
      options: state.options
    }));
  }

  // Docsify plugin
  if (!window.$docsify) window.$docsify = {};
  if (!window.$docsify.plugins) window.$docsify.plugins = [];
  window.$docsify.plugins.push(function(hook) {
    hook.doneEach(function() {
      loadState();
      setTimeout(function() {
        injectCheckboxes();
        renderToolbar();
      }, 200);
    });
  });

  function injectCheckboxes() {
    var content = document.querySelector('.markdown-section');
    if (!content) return;
    // 同时扫描 h2、h3（英语错题用 h3）、h4（其他科目用 h4）
    var headings = content.querySelectorAll('h2, h3, h4');
    headings.forEach(function(heading) {
      var text = heading.textContent || '';
      if (!text.match(/错题\s*\d+/)) return;
      if (heading.querySelector('.qb-checkbox')) return;
      var id = heading.id || text.trim().replace(/\s+/g, '-').replace(/[：:]/g, '-');

      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.className = 'qb-checkbox';
      cb.dataset.qid = id;
      cb.checked = state.selectedIds.has(id);

      cb.addEventListener('change', function() {
        if (cb.checked) state.selectedIds.add(id);
        else state.selectedIds.delete(id);
        saveState();
        updateToolbar();
      });

      heading.style.display = 'flex';
      heading.style.alignItems = 'flex-start';
      heading.insertBefore(cb, heading.firstChild);
    });
  }

  function renderToolbar() {
    var existing = document.getElementById('qb-toolbar');
    if (existing) existing.remove();

    var tb = document.createElement('div');
    tb.id = 'qb-toolbar';
    tb.className = 'qb-toolbar';
    tb.innerHTML =
      '<span style="color:#666;">已选：</span>' +
      '<span class="qb-count"><span id="qb-num">' + state.selectedIds.size + '</span> 题</span>' +
      '<button class="qb-btn qb-btn-outline" id="qb-btn-options">选项</button>' +
      '<button class="qb-btn qb-btn-primary" id="qb-btn-generate">生成试卷</button>' +
      '<button class="qb-btn qb-btn-danger" id="qb-btn-clear">清空</button>';
    document.body.appendChild(tb);

    document.getElementById('qb-btn-options').addEventListener('click', showOptionsModal);
    document.getElementById('qb-btn-generate').addEventListener('click', generateExam);
    document.getElementById('qb-btn-clear').addEventListener('click', clearSelection);

    // Options modal
    var modal = document.createElement('div');
    modal.id = 'qb-modal';
    modal.className = 'qb-modal-overlay';
    modal.innerHTML =
      '<div class="qb-modal">' +
      '<h3>试卷选项</h3>' +
      '<label><input type="checkbox" id="qb-opt-analysis" ' + (state.options.includeAnalysis ? 'checked' : '') + '> 包含解析</label>' +
      '<label><input type="checkbox" id="qb-opt-source" ' + (state.options.includeSource ? 'checked' : '') + '> 包含来源</label>' +
      '<label><input type="checkbox" id="qb-opt-answer" ' + (state.options.includeAnswer ? 'checked' : '') + '> 包含正确答案</label>' +
      '<label><input type="checkbox" id="qb-opt-similar" ' + (state.options.includeSimilar ? 'checked' : '') + '> 包含同类题巩固</label>' +
      '<div class="qb-modal-actions">' +
      '<button class="qb-btn qb-btn-outline" id="qb-modal-cancel">取消</button>' +
      '<button class="qb-btn qb-btn-primary" id="qb-modal-confirm">确认</button>' +
      '</div></div>';
    document.body.appendChild(modal);

    document.getElementById('qb-modal-cancel').addEventListener('click', function() {
      modal.classList.remove('active');
    });
    document.getElementById('qb-modal-confirm').addEventListener('click', function() {
      state.options.includeAnalysis = document.getElementById('qb-opt-analysis').checked;
      state.options.includeSource = document.getElementById('qb-opt-source').checked;
      state.options.includeAnswer = document.getElementById('qb-opt-answer').checked;
      state.options.includeSimilar = document.getElementById('qb-opt-similar').checked;
      saveState();
      modal.classList.remove('active');
    });
    modal.addEventListener('click', function(e) {
      if (e.target === modal) modal.classList.remove('active');
    });
  }

  function showOptionsModal() {
    document.getElementById('qb-opt-analysis').checked = state.options.includeAnalysis;
    document.getElementById('qb-opt-source').checked = state.options.includeSource;
    document.getElementById('qb-opt-answer').checked = state.options.includeAnswer;
    document.getElementById('qb-opt-similar').checked = state.options.includeSimilar;
    document.getElementById('qb-modal').classList.add('active');
  }

  function updateToolbar() {
    var el = document.getElementById('qb-num');
    if (el) el.textContent = state.selectedIds.size;
  }

  function clearSelection() {
    if (state.selectedIds.size === 0) return;
    if (!confirm('确定清空全部 ' + state.selectedIds.size + ' 道已选题目？')) return;
    state.selectedIds.clear();
    saveState();
    document.querySelectorAll('.qb-checkbox').forEach(function(cb) { cb.checked = false; });
    updateToolbar();
  }

  function extractQuestion(heading) {
    var data = { id: heading.id, title: heading.textContent.replace(/^错题\s*\d+[：:]\s*/, '').trim(), fullTitle: heading.textContent.trim(), html: '', tagName: heading.tagName };
    var blocks = [];
    var el = heading.nextElementSibling;
    while (el && el.tagName !== heading.tagName) {
      blocks.push(el.outerHTML);
      el = el.nextElementSibling;
    }
    data.html = blocks.join('\n');
    return data;
  }

  function getPageSubject() {
    var h1 = document.querySelector('.markdown-section h1');
    if (h1) {
      var t = h1.textContent;
      if (t.includes('数学')) return '数学';
      if (t.includes('语文')) return '语文';
      if (t.includes('英语')) return '英语';
      if (t.includes('地理')) return '地理';
      if (t.includes('历史')) return '历史';
      if (t.includes('政治')) return '政治';
    }
    return '';
  }

  function generateExam() {
    if (state.selectedIds.size === 0) { alert('请先勾选题目'); return; }

    var allHeadings = document.querySelectorAll('.markdown-section h2, .markdown-section h3, .markdown-section h4');
    var questions = [];
    var subject = getPageSubject();

    allHeadings.forEach(function(heading) {
      var id = heading.id || heading.textContent.trim().replace(/\s+/g, '-').replace(/[：:]/g, '-');
      if (state.selectedIds.has(id)) {
        questions.push(extractQuestion(heading));
      }
    });

    if (questions.length === 0) { alert('当前页面没有已选中的题目，请切换到对应学科页面'); return; }

    var now = new Date();
    var dateStr = now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日';
    var defaultName = (subject || '综合') + '错题组卷 - ' + dateStr;
    showExamNameModal(questions, subject, defaultName);
  }

  function showExamNameModal(questions, subject, defaultName) {
    var overlay = document.createElement('div');
    overlay.className = 'qb-modal-overlay active';
    overlay.innerHTML =
      '<div class="qb-modal" style="min-width:360px;">' +
      '<h3>生成试卷</h3>' +
      '<span class="qb-field-label">试卷名称</span>' +
      '<input type="text" id="qb-exam-name" value="' + defaultName + '" placeholder="请输入试卷名称">' +
      '<span class="qb-field-label">验证密码</span>' +
      '<input type="password" id="qb-exam-pwd" placeholder="请输入密码">' +
      '<p id="qb-pwd-err" style="color:#e74c3c;font-size:12px;display:none;margin-top:0;">密码错误，请重试</p>' +
      '<div style="margin-top:16px;display:flex;gap:10px;justify-content:flex-end;">' +
      '<button class="qb-btn qb-btn-outline" id="qb-name-cancel">取消</button>' +
      '<button class="qb-btn qb-btn-primary" id="qb-name-confirm">确认生成</button>' +
      '</div></div>';
    document.body.appendChild(overlay);

    overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
    document.getElementById('qb-name-cancel').addEventListener('click', function() { overlay.remove(); });
    var wrongAttempts = 0;
    document.getElementById('qb-name-confirm').addEventListener('click', async function() {
      var pwd = document.getElementById('qb-exam-pwd').value;
      var err = document.getElementById('qb-pwd-err');
      var encoder = new TextEncoder();
      var hashBuffer = await crypto.subtle.digest('SHA-256', encoder.encode(pwd));
      var hashArray = Array.from(new Uint8Array(hashBuffer));
      var hashHex = hashArray.map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
      if (hashHex !== '91b4d142823f7d20c5f08df69122de43f35f057a988d9619f6d3138485c9a203') {
        wrongAttempts++;
        if (wrongAttempts >= 2) {
          var limitModal = document.createElement('div');
          limitModal.className = 'qb-modal-overlay active';
          limitModal.innerHTML =
            '<div class="qb-modal">' +
            '<h3>提示</h3>' +
            '<p style="margin:12px 0;color:#e74c3c;font-size:15px;">该功能仅限kfdzcoffee个人使用！</p>' +
            '<div class="qb-modal-actions">' +
            '<button class="qb-btn qb-btn-primary" id="qb-limit-close">知道了</button>' +
            '</div></div>';
          document.body.appendChild(limitModal);
          limitModal.addEventListener('click', function(e) { if (e.target === limitModal) limitModal.remove(); });
          document.getElementById('qb-limit-close').addEventListener('click', function() { limitModal.remove(); });
          return;
        } else {
          err.textContent = '密码错误，请重试';
        }
        err.style.display = 'block';
        return;
      }
      err.style.display = 'none';
      var name = document.getElementById('qb-exam-name').value.trim() || defaultName;
      overlay.remove();
      doGenerateExam(questions, subject, name);
    });
    document.getElementById('qb-exam-pwd').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('qb-name-confirm').click();
    });
  }

  function doGenerateExam(questions, subject, name) {
    var now = new Date();
    var dateStr = now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日';
    var isEnglish = (subject === '英语');

    var html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">';
    html += '<head><meta charset="utf-8"><title>' + name + '</title>';
    html += '<style>body{font-family:"Microsoft YaHei",SimSun,sans-serif;font-size:14px;line-height:1.8;padding:40px;}h1{text-align:center;font-size:22px;margin-bottom:30px;}h3{font-size:16px;color:#333;margin-top:24px;}p{margin:6px 0;}.passage{background:#f5f7fa;padding:14px 18px;border-left:4px solid #007DFF;margin:10px 0;}.passage-title{font-weight:700;color:#007DFF;margin-bottom:6px;font-size:13px;}.source{color:#999;font-size:12px;}.analysis-section{margin-top:32px;padding-top:16px;border-top:2px solid #4a90d9;}.analysis-section h2{font-size:18px;color:#4a90d9;margin-bottom:12px;}.analysis-item{background:#f9f9f9;padding:10px 14px;border-left:3px solid #4a90d9;margin:8px 0;font-size:13px;}hr{border:none;border-top:1px dashed #ddd;margin:20px 0;}blockquote{color:#666;margin:8px 0;padding-left:12px;border-left:3px solid #ddd;}table{border-collapse:collapse;width:100%;margin:8px 0;}table td,table th{border:1px solid #ddd;padding:6px 10px;}</style>';
    html += '</head><body>';
    html += '<h1>' + name + '</h1>';
    html += '<p style="text-align:center;color:#999;">共 ' + questions.length + ' 题 | 科目：' + (subject||'综合') + ' | 生成时间：' + dateStr + '</p>';

    // 收集所有解析块（后置输出）
    var allAnalyses = [];

    questions.forEach(function(q, i) {
      html += '<h3>' + (i+1) + '. ' + q.title + '</h3>';

      var tempDiv = document.createElement('div');
      tempDiv.innerHTML = q.html;
      var children = tempDiv.children;
      var inAnalysis = false, inSimilar = false;
      var analysisBlocks = [];
      var hasPassage = false;

      for (var j = 0; j < children.length; j++) {
        var child = children[j];
        var text = child.textContent || '';
        var tag = child.tagName;

        // 英语：检测配套原文（第一个长 blockquote 或 "完整题干" 标记）
        if (isEnglish && !hasPassage && tag === 'BLOCKQUOTE' && text.length > 60) {
          html += '<div class="passage"><div class="passage-title">配套原文</div>' + child.innerHTML + '</div>';
          hasPassage = true;
          continue;
        }
        // 英语："完整题干" 后面的 blockquote 当原文
        if (isEnglish && !hasPassage && text.includes('完整题干') && tag !== 'BLOCKQUOTE') {
          var nextBlock = children[j+1];
          if (nextBlock && nextBlock.tagName === 'BLOCKQUOTE') {
            html += '<div class="passage"><div class="passage-title">配套原文</div>' + nextBlock.innerHTML + '</div>';
            hasPassage = true;
            j++; // skip the blockquote
          }
          continue;
        }

        if (text.includes('错因分析') || text.includes('正确解法') || text.includes('关键步骤') ||
            text.includes('错误原因') || text.includes('词汇积累') || text.includes('同类词') ||
            text.includes('评分明细') || text.includes('错因逐条')) {
          inAnalysis = true;
        }
        if (text.includes('同类题巩固') || text.includes('同类题警示')) {
          inSimilar = true;
          // 同类题警示也放入解析
          analysisBlocks.push(child.outerHTML);
          continue;
        }

        if (text.includes('正确答案') || text.includes('手写答案')) {
          if (state.options.includeAnswer) {
            if (inAnalysis) analysisBlocks.push(child.outerHTML);
            else html += child.outerHTML;
          }
          continue;
        }

        if ((text.includes('**来源**') || text.includes('录入日期') || text.includes('录入时间') ||
             text.includes('文章主题')) && (child.tagName === 'BLOCKQUOTE' || text.includes('**来源**'))) {
          if (state.options.includeSource) {
            html += '<p class="source">' + child.innerHTML + '</p>';
          }
          continue;
        }

        if (inAnalysis) {
          if (state.options.includeAnalysis) {
            analysisBlocks.push(child.outerHTML);
          }
        } else {
          html += child.outerHTML;
        }
      }

      if (analysisBlocks.length > 0) {
        allAnalyses.push({ title: q.fullTitle, blocks: analysisBlocks });
      }

      html += '<hr>';
    });

    // 解析后置：所有题目的解析统一放在最后
    if (state.options.includeAnalysis && allAnalyses.length > 0) {
      html += '<div class="analysis-section">';
      html += '<h2>参考答案与解析</h2>';
      allAnalyses.forEach(function(a, idx) {
        html += '<h4>' + (idx+1) + '. ' + a.title + '</h4>';
        a.blocks.forEach(function(b) {
          html += '<div class="analysis-item">' + b + '</div>';
        });
      });
      html += '</div>';
    }

    html += '</body></html>';

    var blob = new Blob(['\ufeff' + html], { type: 'application/msword;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name.replace(/[\/:*?"<>|]/g, '_') + '.doc';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // Initialize
  loadState();
})();
</script>
